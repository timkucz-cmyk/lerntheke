<!DOCTYPE html>
<html lang="de" data-fach="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Lerntheke</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231F4D2A'/%3E%3Cpath d='M4 11.5V4.5h1.6v5.6H9v1.4z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<a class="skiplink" href="#inhalt">Zum Inhalt springen</a>

<header class="kopf">
  <div class="kopf-innen">
    <a class="kopf-titel" href="#/" data-nav>
      <span class="kopf-mark" aria-hidden="true">
        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
          <rect width="80" height="80" rx="12" fill="#1F4D2A"></rect>
          <text x="40" y="48" text-anchor="middle" font-family="inherit" font-weight="600"
                font-size="22" fill="#ffffff">LMG</text>
        </svg>
      </span>
      <span class="kopf-wort">
        <b>Lerntheke</b>
        <span class="kopf-schule">Ludwig-Meyn-Gymnasium</span>
      </span>
    </a>
    <nav class="kopf-nav" id="kopfnav" aria-label="Thema"></nav>
  </div>
</header>

<main id="inhalt" tabindex="-1">
  <p class="laden">Lade …</p>
</main>

<footer class="fuss">
  <p>Alle Eingaben bleiben auf diesem Gerät (localStorage). Es werden keine Daten übertragen.</p>
</footer>

<div id="meldung" class="meldung" role="status" aria-live="polite" hidden></div>

<noscript>
  <p style="padding:1rem">Diese Seite benötigt JavaScript.</p>
</noscript>

<script>
/* Klassisches Skript – läuft auch dann, wenn der Browser ES-Module blockiert.
   Genau das passiert beim Doppelklick auf index.html: Über file:// werden Module
   und fetch abgewiesen, die App käme sonst nie über "Lade ..." hinaus. */
(function () {
  var inhalt = document.getElementById('inhalt');

  function zeige(html) {
    if (inhalt.querySelector('.laden')) inhalt.innerHTML = html;
  }

  // Alles außer http(s) heißt: kein Server – also auch keine Module und kein fetch.
  if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    zeige(
      '<h1>Bitte über einen Webserver öffnen</h1>' +
      '<p class="hinweis hinweis-warn">Diese Seite wurde direkt aus dem Dateisystem geöffnet. ' +
      'Browser lassen dabei weder Module noch das Laden der Inhalte zu.</p>' +
      '<p>Zwei Wege:</p>' +
      '<ul>' +
      '<li>Im Projektordner <strong>start.cmd</strong> doppelklicken – das startet einen kleinen ' +
      'Server und öffnet die Lerntheke im Browser.</li>' +
      '<li>Oder im Projektordner <code>python -m http.server 8000</code> ausführen und ' +
      '<code>http://localhost:8000</code> aufrufen.</li>' +
      '</ul>' +
      '<p class="meta">Auf GitHub Pages tritt das Problem nicht auf – dort läuft die Seite ohnehin über einen Server.</p>'
    );
    return;
  }

  // Sicherheitsnetz: Hat die App nach fünf Sekunden nicht übernommen, steht hier
  // wenigstens ein Hinweis statt eines ewigen "Lade ...".
  setTimeout(function () {
    zeige(
      '<h1>Die App konnte nicht starten</h1>' +
      '<p class="hinweis hinweis-warn">Die Programmdateien wurden nicht geladen. ' +
      'Meist fehlt ein Ordner (<code>app/</code>, <code>inhalte/</code>) oder der Server liefert ' +
      'die Dateien nicht aus.</p>' +
      '<p class="meta">Mehr dazu steht in der Konsole des Browsers.</p>'
    );
  }, 5000);
})();
</script>

<script type="module" src="app/app.js"></script>
</body>
</html>
