<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100"
     role="img" aria-label="Zwei Sprechblasen: abwechselnd laut rechnen">
  <style>
    .kurve  { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .flaeche{ fill: #B61E33; fill-opacity: .2; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .achse  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #6b7280; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 17px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .kurve  { stroke: #E8677D; }
      .flaeche{ fill: #E8677D; fill-opacity: .22; }
      .marke  { fill: #E8677D; }
      .grau   { stroke: #9aa1a9; }
      .achse  { stroke: #6b7280; }
      .fuell  { fill: #9aa1a9; fill-opacity: .16; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="kurve" d="M20 22 h56 a6 6 0 0 1 6 6 v22 a6 6 0 0 1 -6 6 h-38 l-10 10 v-10 h-8 a6 6 0 0 1 -6 -6 v-22 a6 6 0 0 1 6 -6 z"/>
  <path class="grau" d="M84 44 h56 a6 6 0 0 1 6 6 v22 a6 6 0 0 1 -6 6 h-8 v10 l-10 -10 h-38 a6 6 0 0 1 -6 -6 v-22 a6 6 0 0 1 6 -6 z"/>
  <text class="text" x="48" y="43" text-anchor="middle">A</text>
  <text class="text" x="112" y="65" text-anchor="middle">B</text>
</svg>
