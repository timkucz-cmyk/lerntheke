<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Balkenwaage im Gleichgewicht">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M80 16 L80 64 M64 64 h32"/>
  <path class="akzent" d="M30 16 H130"/>
  <path class="hilfs" d="M40 16 v10 M120 16 v10"/>
  <rect class="fuell" x="24" y="26" width="32" height="16" rx="3"/>
  <rect class="fuell" x="104" y="26" width="32" height="16" rx="3"/>
  <text class="text" x="40" y="38" text-anchor="middle">3x</text>
  <text class="text" x="120" y="38" text-anchor="middle">15</text>
  <circle class="marke" cx="80" cy="16" r="3.5"/>
</svg>
