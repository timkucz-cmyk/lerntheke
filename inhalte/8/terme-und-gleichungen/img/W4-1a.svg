<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80"
     role="img" aria-label="Zahlengerade: offener Kreis bei 4, Bereich links davon">
  <style>
    .kurve  { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
