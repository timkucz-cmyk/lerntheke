<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Quadrat der Seitenlänge a + b, zerlegt in a², ab, ab und b²">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <rect class="fuell" x="50" y="6" width="36" height="36"/>
  <path class="grau" d="M50 6 h58 v58 h-58 z M86 6 v58 M50 42 h58"/>
  <text class="text" x="68" y="28" text-anchor="middle">a²</text>
  <text class="text" x="97" y="28" text-anchor="middle">ab</text>
  <text class="text" x="68" y="57" text-anchor="middle">ab</text>
  <text class="text" x="97" y="57" text-anchor="middle">b²</text>
</svg>
