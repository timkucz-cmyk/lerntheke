    }
  </style>
  <path class="grau" d="M14 60 L74 60 L44 30 Z"/>
  <path class="hilfs" d="M44 60 V52"/>
  <path class="akzent" d="M96 62 L106 14 L116 62 M101 38 H111"/>
  <rect class="fuell" x="124" y="30" width="26" height="32"/>
</svg>
