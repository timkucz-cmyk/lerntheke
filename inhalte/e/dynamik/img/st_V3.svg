<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Kleiner Rennwagen mit Gasstrahl">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M8 62 H152"/>
  <path class="fuell" d="M60 44 H120 L132 52 H60 Z"/>
  <path class="grau" d="M60 44 H120 L132 52 H60 Z"/>
  <circle class="grau" cx="72" cy="56" r="5"/>
  <circle class="grau" cx="118" cy="56" r="5"/>
  <path class="grau" d="M56 48 L20 48"/>
  <path class="marke" d="M20 48 L26 45 L26 51 Z"/>
  <path class="akzent" d="M96 30 L132 30"/>
  <path class="marke" d="M132 30 L126 33 L126 27 Z"/>
</svg>
