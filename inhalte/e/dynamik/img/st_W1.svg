<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Zwei Personen im Tandem">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <circle class="grau" cx="44" cy="24" r="10"/>
  <path class="grau" d="M26 64 q18 -26 36 0"/>
  <circle class="akzent" cx="116" cy="24" r="10"/>
  <path class="akzent" d="M98 64 q18 -26 36 0"/>
  <text class="text gross" x="72" y="40">p</text>
</svg>
