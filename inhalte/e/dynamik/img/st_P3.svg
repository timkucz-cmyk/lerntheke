<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Paket auf einer schiefen Ebene mit zerlegter Gewichtskraft">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M16 64 H144 V14 Z"/>
  <path class="fuell" d="M76 40 l18 -7 l6 15 l-18 7 z"/>
  <path class="grau" d="M88 44 L88 66"/>
  <path class="marke" d="M88 66 L85 60 L91 60 Z"/>
  <path class="akzent" d="M88 44 L66 52"/>
  <path class="marke" d="M66 52 L71 47 L73 52 Z"/>
  <path class="akzent" d="M88 44 L104 28"/>
  <path class="marke" d="M104 28 L101 34 L98 31 Z"/>
