<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Zwei geladene Kugeln, die sich abstoßen">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <circle class="akzent" cx="56" cy="38" r="10"/>
  <path class="akzent" d="M52 38 h8"/>
  <path class="akzent" d="M56 34 v8"/>
  <circle class="akzent" cx="104" cy="38" r="10"/>
  <path class="akzent" d="M100 38 h8"/>
  <path class="akzent" d="M104 34 v8"/>
  <path class="akzent" d="M44.0 38.0 L20.0 38.0"/>
  <path class="marke" d="M20.0 38.0 L25.4 35.4 L25.4 40.6 z"/>
  <path class="akzent" d="M116.0 38.0 L140.0 38.0"/>
  <path class="marke" d="M140.0 38.0 L134.6 40.6 L134.6 35.4 z"/>
</svg>
