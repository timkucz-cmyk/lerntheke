<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Satellit auf einer Kreisbahn um die Erde">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <circle class="fuell" cx="80" cy="35" r="12"/>
  <circle class="grau" cx="80" cy="35" r="12"/>
  <circle class="hilfs" cx="80" cy="35" r="27"/>
  <circle class="marke" cx="107" cy="35" r="3.5"/>
  <path class="grau" d="M103.0 35.0 L93.0 35.0"/>
  <path class="marke" d="M93.0 35.0 L98.4 32.4 L98.4 37.6 z"/>
  <path class="akzent" d="M107.0 31.0 L107.0 12.0"/>
  <path class="marke" d="M107.0 12.0 L109.6 17.4 L104.4 17.4 z"/>
