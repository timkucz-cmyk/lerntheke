  </style>
  <circle class="grau" cx="80" cy="14" r="6"/>
  <path class="grau" d="M80 20 V48 M80 48 L72 64 M80 48 L88 64"/>
  <path class="akzent" d="M80 28 L54 28 M80 28 L106 28"/>
  <path class="hilfs" d="M40 54 A40 10 0 0 0 120 54"/>
