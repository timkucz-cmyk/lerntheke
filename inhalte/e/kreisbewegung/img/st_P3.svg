    }
  </style>
  <path class="grau" d="M20 64 A60 60 0 0 1 80 8"/>
  <path class="grau" d="M44 64 A40 40 0 0 1 80 28"/>
  <rect class="fuell" x="58" y="30" width="16" height="10"/>
  <rect class="grau" x="58" y="30" width="16" height="10"/>
  <path class="akzent" d="M66 35 L100 64"/>
  <path class="marke" d="M100 64 L93 62 L97 58 Z"/>
  <circle class="marke" cx="104" cy="64" r="2"/>
