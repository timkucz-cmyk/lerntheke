  </style>
  <path class="grau" d="M30 20 L96 20 M30 34 L110 34 M30 48 L86 48"/>
  <path class="akzent" d="M26 30 L114 38"/>
  <circle class="akzent" cx="128" cy="38" r="14"/>
  <text class="text gross" x="121" y="47">!</text>
</svg>
