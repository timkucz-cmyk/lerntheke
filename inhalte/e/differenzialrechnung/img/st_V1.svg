  </style>
  <path class="grau" d="M30 22 L30 62 L130 62 L130 22"/>
  <path class="fuell" d="M31 40 L129 40 L129 61 L31 61 Z"/>
  <path class="akzent" d="M31 40 L129 40"/>
  <path class="hilfs" d="M30 30 L130 30"/>
  <path class="marke" d="M58 6 l3 7 a3 3 0 1 1 -6 0 z M80 10 l3 7 a3 3 0 1 1 -6 0 z M102 6 l3 7 a3 3 0 1 1 -6 0 z"/>
