<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Energiebalken: Lageenergie wird zu Bewegungsenergie">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M16 64 H148"/>
  <rect class="fuell" x="28" y="16" width="22" height="48"/>
  <rect class="grau" x="28" y="16" width="22" height="48"/>
  <rect class="fuell" x="72" y="40" width="22" height="24"/>
  <rect class="grau" x="72" y="40" width="22" height="24"/>
  <path class="akzent" d="M98 64 V40 h22 V64"/>
  <path class="akzent" d="M124 64 V16 h22 V64"/>
  <text class="text" x="28" y="11">pot</text>
  <text class="text" x="124" y="11">kin</text>
</svg>
