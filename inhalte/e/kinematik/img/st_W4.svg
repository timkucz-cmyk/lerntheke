  </style>
  <path class="hilfs" d="M8 84 q12 -6 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/>
  <path class="grau" d="M30 70 h96 l-12 12 h-72 z"/>
  <path class="hilfs" d="M58 30 V68" stroke-dasharray="4 3"/>
  <path class="akzent" d="M58 30 Q90 30 104 68"/>
  <circle class="marke" cx="58" cy="28" r="3.4"/>
