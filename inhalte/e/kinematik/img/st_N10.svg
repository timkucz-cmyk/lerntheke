  </style>
  <path class="hilfs" d="M8 60 q12 -5 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/>
  <path class="grau" d="M30 46 h96 l-12 11 h-72 z"/>
  <path class="hilfs" d="M58 10 V44" stroke-dasharray="4 3"/>
  <path class="akzent" d="M58 10 Q90 10 104 44"/>
