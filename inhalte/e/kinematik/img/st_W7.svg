<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100"
     role="img" aria-label="Energiebalken: Lageenergie wird zu Bewegungsenergie">
  <style>
    .akzent { fill: none; stroke: #2C5282; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2C5282; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #6b7280; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 22px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #9aa1a9; fill-opacity: .16; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M16 86 H148"/>
  <rect class="fuell" x="28" y="26" width="22" height="60"/>
  <rect class="grau" x="28" y="26" width="22" height="60"/>
  <rect class="fuell" x="72" y="56" width="22" height="30"/>
  <rect class="grau" x="72" y="56" width="22" height="30"/>
  <path class="akzent" d="M98 86 V56 h22 V86"/>
  <path class="akzent" d="M124 86 V26 h22 V86"/>
  <text class="text" x="30" y="20">pot</text>
  <text class="text" x="124" y="20">kin</text>
</svg>
