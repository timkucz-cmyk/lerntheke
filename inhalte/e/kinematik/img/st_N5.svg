  </style>
  <path class="grau" d="M24 16 H100 M24 34 H112 M24 52 H90"/>
  <path class="akzent" d="M114 10 l18 18 M132 10 l-18 18"/>
  <path class="akzent" d="M114 48 l7 7 l14 -16"/>
