<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100"
     role="img" aria-label="Zwei Fähren fahren aufeinander zu">
  <style>
    .akzent { fill: none; stroke: #2C5282; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2C5282; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #6b7280; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 22px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #9aa1a9; fill-opacity: .16; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="hilfs" d="M8 64 q12 -6 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/>
  <path class="akzent" d="M18 56 h34 l-6 10 h-22 z"/>
  <path class="grau" d="M142 56 h-34 l6 10 h22 z"/>
  <path class="akzent" d="M58 46 h14 l-4 -4 M72 46 l-4 4"/>
  <path class="grau" d="M102 46 h-14 l4 -4 M88 46 l4 4"/>
</svg>
