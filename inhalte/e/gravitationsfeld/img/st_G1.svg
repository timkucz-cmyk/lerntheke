    }
  </style>
  <text class="text gross" x="12" y="44">10ⁿ</text>
  <circle class="grau" cx="86" cy="35" r="20"/>
  <circle class="marke" cx="86" cy="35" r="2"/>
  <circle class="fuell" cx="106" cy="35" r="4"/>
