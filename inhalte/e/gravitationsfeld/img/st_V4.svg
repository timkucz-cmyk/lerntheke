    }
  </style>
  <path class="grau" d="M10 66 Q80 50 150 66"/>
  <path class="hilfs" d="M80 54 V8"/>
  <path class="akzent" d="M76 42 V28 L80 20 L84 28 V42 Z"/>
  <path class="akzent" d="M76 42 l-4 6 h4 M84 42 l4 6 h-4"/>
  <circle class="marke" cx="80" cy="8" r="2"/>
</svg>
