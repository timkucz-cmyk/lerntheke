      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M14 10 Q40 60 80 62 Q120 60 146 10"/>
  <circle class="akzent" cx="72" cy="54" r="6"/>
  <circle class="akzent" cx="88" cy="54" r="6"/>
  <path class="akzent" d="M80 50 L80 20"/>
  <path class="marke" d="M80 20 L83 26 L77 26 Z"/>
</svg>
