<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Baumdiagramm mit hervorgehobenem Pfad">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="akzent" d="M30 35 L78 19"/>
  <path class="akzent" d="M78 19 L126 11"/>
  <circle class="marke" cx="126" cy="11" r="2.5"/>
  <path class="grau" d="M78 19 L126 27"/>
  <circle class="marke" cx="126" cy="27" r="2.5"/>
  <circle class="marke" cx="78" cy="19" r="2.5"/>
  <path class="grau" d="M30 35 L78 51"/>
  <path class="grau" d="M78 51 L126 43"/>
  <circle class="marke" cx="126" cy="43" r="2.5"/>
  <path class="grau" d="M78 51 L126 59"/>
  <circle class="marke" cx="126" cy="59" r="2.5"/>
  <circle class="marke" cx="78" cy="51" r="2.5"/>
  <circle class="marke" cx="30" cy="35" r="3"/>
</svg>
