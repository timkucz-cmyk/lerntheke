<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Zwei Sensoren an einer Decke mit Flamme">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="hilfs" d="M10 10 H150"/>
  <rect class="akzent" x="40" y="10" width="20" height="8" rx="2"/>
  <rect class="akzent" x="100" y="10" width="20" height="8" rx="2"/>
  <path class="fuell" d="M80 64 c-14 0 -16 -14 -6 -24 c0 8 6 8 6 0 c0 -6 4 -10 6 -12 c2 10 12 14 6 28 c-2 6 -6 8 -12 8 Z"/>
  <path class="grau" d="M80 64 c-14 0 -16 -14 -6 -24 c0 8 6 8 6 0 c0 -6 4 -10 6 -12 c2 10 12 14 6 28 c-2 6 -6 8 -12 8 Z"/>
</svg>
