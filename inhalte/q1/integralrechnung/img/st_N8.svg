  <circle class="hilfs" cx="66" cy="33" r="2"/><circle class="hilfs" cx="74" cy="33" r="2"/><circle class="hilfs" cx="82" cy="33" r="2"/>
  <circle class="hilfs" cx="66" cy="43" r="2"/><circle class="hilfs" cx="74" cy="43" r="2"/><circle class="hilfs" cx="82" cy="43" r="2"/>
