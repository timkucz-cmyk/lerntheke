      .achse   { stroke: #6b7280; }
      .hilfs   { stroke: #6b7280; }
      .marke   { fill: #E8677D; }
      .koerper { stroke: #9aa1a9; }
      .fuellung{ fill: #9aa1a9; fill-opacity: .16; }
      .fuellung-voll { fill: #9aa1a9; }
      .kopf    { fill: #9aa1a9; }
      .text    { fill: #9aa1a9; }
    }
