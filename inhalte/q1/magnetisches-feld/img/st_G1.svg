<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Feldlinien, Kreisbahn und Kräftepfeile als Grundlagen">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="akzent" d="M20.0 55.0 L55.0 55.0"/>
  <path class="marke" d="M55.0 55.0 L49.6 57.6 L49.6 52.4 z"/>
  <path class="akzent" d="M20.0 55.0 L20.0 25.0"/>
  <path class="marke" d="M20.0 25.0 L22.6 30.4 L17.4 30.4 z"/>
  <circle class="grau" cx="100" cy="35" r="20"/>
  <path class="akzent" d="M100.0 15.0 L112.0 15.0"/>
  <path class="marke" d="M112.0 15.0 L106.6 17.6 L106.6 12.4 z"/>
</svg>
