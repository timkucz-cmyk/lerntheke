<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Feldlinien zwischen zwei Stabmagneten">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <rect class="fuell" x="12" y="28" width="25.0" height="14"/>
  <rect class="grau" x="12" y="28" width="50" height="14"/>
  <path class="grau" d="M37.0 28 v14"/>
  <text class="text" x="21.5" y="39">S</text>
  <text class="text" x="45.5" y="39">N</text>
  <rect class="fuell" x="98" y="28" width="25.0" height="14"/>
  <rect class="grau" x="98" y="28" width="50" height="14"/>
  <path class="grau" d="M123.0 28 v14"/>
  <text class="text" x="107.5" y="39">S</text>
  <text class="text" x="131.5" y="39">N</text>
  <path class="akzent" d="M62 32 Q80.0 18 98 32"/>
  <path class="akzent" d="M62 38 Q80.0 52 98 38"/>
  <path class="akzent" d="M62 35 H98"/>
</svg>
