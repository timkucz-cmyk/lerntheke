    }
  </style>
  <path class="grau" d="M30 15 H130 V55 H30 z"/>
  <path class="akzent" d="M50 8 V22 M58 8 V22"/>
  <ellipse class="akzent" cx="88" cy="55" rx="3" ry="7"/>
  <ellipse class="akzent" cx="96" cy="55" rx="3" ry="7"/>
  <ellipse class="akzent" cx="104" cy="55" rx="3" ry="7"/>
  <ellipse class="akzent" cx="112" cy="55" rx="3" ry="7"/>
