<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Spule mit Feldlinien im Inneren">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <ellipse class="grau" cx="50" cy="35" rx="3" ry="12"/>
  <ellipse class="grau" cx="59" cy="35" rx="3" ry="12"/>
  <ellipse class="grau" cx="68" cy="35" rx="3" ry="12"/>
  <ellipse class="grau" cx="77" cy="35" rx="3" ry="12"/>
  <ellipse class="grau" cx="86" cy="35" rx="3" ry="12"/>
  <ellipse class="grau" cx="95" cy="35" rx="3" ry="12"/>
  <path class="akzent" d="M40.0 31.0 L120.0 31.0"/>
  <path class="marke" d="M120.0 31.0 L114.6 33.6 L114.6 28.4 z"/>
  <path class="akzent" d="M40.0 39.0 L120.0 39.0"/>
  <path class="marke" d="M120.0 39.0 L114.6 41.6 L114.6 36.4 z"/>
</svg>
