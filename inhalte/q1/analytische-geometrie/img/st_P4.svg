  </style>
  <path class="fuell" d="M20 52 L96 52 L140 24 L64 24 Z"/>
  <path class="grau" d="M20 52 L96 52 L140 24 L64 24 Z"/>
  <path class="akzent" d="M60 4 L80 38"/>
  <path class="hilfs" d="M80 38 L88 52"/>
