<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Zwei Vektoren mit Winkel; das Lot von der Spitze des einen Vektors markiert die Projektion auf den anderen">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M24 58 H140"/>
  <path class="marke" d="M142 58 l-9 -4 v8 z"/>
  <path class="akzent" d="M24 58 L92 14"/>
  <path class="marke" d="M94 13 l-10 1 l5 7 z"/>
  <path class="hilfs" d="M92 14 V58"/>
  <path class="grau" d="M86 58 v-6 h6"/>
  <rect class="marke" x="24" y="61" width="68" height="3.5"/>
  <path class="grau" d="M44 58 A20 20 0 0 0 41 47"/>
</svg>
