<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Zwei Histogramme: schmal und breit gestreut">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M20 62 h124 M20 62 V8"/>
  <rect class="akzent" x="28" y="58" width="12" height="4"/>
  <rect class="akzent" x="40" y="22" width="12" height="40"/>
  <rect class="akzent" x="52" y="58" width="12" height="4"/>
  <rect class="grau" x="86" y="42" width="11" height="20"/>
  <rect class="grau" x="97" y="54" width="11" height="8"/>
  <rect class="grau" x="108" y="56" width="11" height="6"/>
  <rect class="grau" x="119" y="54" width="11" height="8"/>
  <rect class="grau" x="130" y="42" width="11" height="20"/>
</svg>
