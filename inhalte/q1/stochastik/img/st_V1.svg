<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Zwei Flaschen und eine Punktreihe der Füllmengen">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <rect class="grau" x="28" y="18" width="16" height="42" rx="4"/>
  <rect class="akzent" x="52" y="18" width="16" height="42" rx="4"/>
  <path class="hilfs" d="M80 50 H144 M112 20 V58"/>
  <circle class="marke" cx="100" cy="44" r="2.5"/>
  <circle class="marke" cx="106" cy="44" r="2.5"/>
  <circle class="marke" cx="110" cy="44" r="2.5"/>
  <circle class="marke" cx="114" cy="44" r="2.5"/>
  <circle class="marke" cx="120" cy="44" r="2.5"/>
  <circle class="marke" cx="126" cy="44" r="2.5"/>
</svg>
