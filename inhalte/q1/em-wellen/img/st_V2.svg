<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Scheibe mit Spuren und gebeugten Strahlen">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <circle class="grau" cx="45" cy="35" r="28"/>
  <circle class="hilfs" cx="45" cy="35" r="20"/>
  <circle class="hilfs" cx="45" cy="35" r="13"/>
  <circle class="fuell" cx="45" cy="35" r="5"/>
  <path class="akzent" d="M90.0 35.0 L150.0 12.0"/>
  <path class="marke" d="M150.0 12.0 L145.9 16.4 L144.0 11.5 z"/>
  <path class="akzent" d="M90.0 35.0 L150.0 58.0"/>
  <path class="marke" d="M150.0 58.0 L144.0 58.5 L145.9 53.6 z"/>
  <path class="grau" d="M90 35 H150"/>
</svg>
