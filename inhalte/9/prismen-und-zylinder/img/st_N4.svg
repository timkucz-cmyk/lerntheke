  <path class="fuell" d="M14 62 L58 62 L48 38 L24 38 Z"/>
  <path class="hilfs" d="M32 44 L76 44 L66 20 L42 20 Z M14 62 L32 44 M58 62 L76 44 M48 38 L66 20 M24 38 L42 20"/>
