<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Zylinder mit Netz aus Rechteck und zwei Kreisen">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="fuell" d="M18 20 V60 A18 6.3 0 0 0 54 60 V20 Z"/>
  <path class="akzent" d="M18 20 V60 A18 6.3 0 0 0 54 60 V20"/>
  <path class="hilfs" d="M18 60 A18 6.3 0 0 1 54 60"/>
  <ellipse class="akzent" cx="36" cy="20" rx="18" ry="6.3"/>
  <path class="fuell" d="M76 26 h70 v22 h-70 Z"/>
  <path class="grau" d="M76 26 h70 v22 h-70 Z"/>
  <circle class="akzent" cx="98" cy="16" r="9.5"/>
