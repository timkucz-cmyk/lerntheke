  </style>
  <path class="fuell" d="M12 30 L112 30 L136 10 L36 10 Z"/>
  <path class="akzent" d="M12 30 L112 30 L112 62 L12 44 Z M12 30 L36 10 L136 10 L112 30 M136 10 V42 L112 62"/>
  <path class="hilfs" d="M36 10 V24 L136 42 M12 44 L36 24"/>
  <path class="grau" d="M40 20 q6 -3 12 0 t12 0 M74 20 q6 -3 12 0 t12 0"/>
