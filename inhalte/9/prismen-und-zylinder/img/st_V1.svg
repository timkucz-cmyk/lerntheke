  <path class="hilfs" d="M46 38 L112 38 L112 24 L90 24 L90 10 L68 10 L68 -4 L46 -4 Z M20 64 L46 38 M86 64 L112 38 M86 50 L112 24 M64 50 L90 24 M64 36 L90 10 M42 36 L68 10 M42 22 L68 -4 M20 22 L46 -4"/>
