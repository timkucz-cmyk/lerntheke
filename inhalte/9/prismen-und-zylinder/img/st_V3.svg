  </style>
  <path class="fuell" d="M14 30 A26 26 0 0 0 66 30 Z"/>
  <path class="akzent" d="M14 30 A26 26 0 0 0 66 30"/>
  <path class="fuell" d="M90 30 L102 60 L130 60 L142 30 Z"/>
