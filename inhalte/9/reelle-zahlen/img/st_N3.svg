      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M14 46 L146 46"/>
  <path class="grau" d="M146 46 l-6 -3 l0 6 z"/>
  <path class="grau" d="M30 42 L30 50 M60 42 L60 50 M90 42 L90 50 M120 42 L120 50"/>
  <path class="akzent" d="M30 34 L120 34"/>
