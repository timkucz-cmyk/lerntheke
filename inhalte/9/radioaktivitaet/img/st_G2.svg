<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Balkendiagramm mit Mittelwertlinie">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M20 62 L144 62 M20 62 L20 8"/>
  <path class="fuell" d="M30 62 L30 30 L44 30 L44 62 Z"/>
  <path class="fuell" d="M52 62 L52 24 L66 24 L66 62 Z"/>
  <path class="fuell" d="M74 62 L74 34 L88 34 L88 62 Z"/>
  <path class="fuell" d="M96 62 L96 26 L110 26 L110 62 Z"/>
  <path class="fuell" d="M118 62 L118 28 L132 28 L132 62 Z"/>
  <path class="akzent" d="M24 28 L142 28"/>
</svg>
