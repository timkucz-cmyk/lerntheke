    }
  </style>
  <path class="grau" d="M8 18 L56 18 L56 52 L8 52 Z"/>
  <path class="akzent" d="M20 26 L20 44"/>
  <path class="akzent" d="M56 22 Q62 35 56 48 Q50 35 56 22 Z"/>
  <path class="hilfs" d="M20 26 L148 62 M20 44 L148 8"/>
