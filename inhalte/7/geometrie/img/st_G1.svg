    }
  </style>
  <path class="grau" d="M24 58 L70 58 M24 58 L56 26"/>
  <path class="akzent" d="M38 58 A14 14 0 0 0 34 48"/>
  <circle class="grau" cx="100" cy="38" r="18"/>
