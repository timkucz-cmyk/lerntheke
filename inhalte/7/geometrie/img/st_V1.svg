    }
  </style>
  <path class="grau" d="M14 64 L34 64 L34 54 L54 54 L54 44 L74 44 L74 34 L94 34 L94 24 L114 24"/>
  <path class="grau" d="M30 62 L30 34 M60 52 L60 20 M90 32 L90 6"/>
  <path class="akzent" d="M14 46 L120 0"/>
