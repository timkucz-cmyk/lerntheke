<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100"
     role="img" aria-label="Sprechblase mit Fragezeichen zwischen Kugel und Welle">
  <style>
    .akzent { fill: none; stroke: #2C5282; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .flaeche{ fill: #2C5282; fill-opacity: .18; }
    .marke  { fill: #2C5282; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #6b7280; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 26px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .flaeche{ fill: #7BAEE8; fill-opacity: .2; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #9aa1a9; fill-opacity: .16; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <circle class="fuell" cx="28" cy="66" r="12"/><circle class="grau" cx="28" cy="66" r="12"/>
  <path class="grau" d="M112.0 66.0 q3.2 12.0 6.5 0.0 t6.5 0.0 t6.5 0.0 t6.5 0.0 t6.5 0.0"/>
  <path class="flaeche" d="M58 14 h44 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-14 l-8 10 v-10 h-22 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8 z"/>
  <path class="akzent" d="M58 14 h44 a8 8 0 0 1 8 8 v24 a8 8 0 0 1 -8 8 h-14 l-8 10 v-10 h-22 a8 8 0 0 1 -8 -8 v-24 a8 8 0 0 1 8 -8 z"/>
  <text class="marke gross" x="80" y="44" text-anchor="middle" style="font-family: 'Source Sans 3', system-ui, sans-serif">?</text>
</svg>
