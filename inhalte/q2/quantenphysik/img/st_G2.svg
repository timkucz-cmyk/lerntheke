<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Elektron im elektrischen Feld zwischen zwei Platten und ein Gitter">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M24 10 V60 M78 10 V60"/>
  <text class="text" x="14" y="16">−</text>
  <text class="text" x="82" y="16">+</text>
  <circle class="marke" cx="34" cy="35" r="3.5"/>
  <path class="akzent" d="M40 35 L70 35"/>
  <path class="marke" d="M70 35 L64.6 37.6 L64.6 32.4 Z"/>
  <path class="hilfs" d="M100 10 V60" stroke-dasharray="2 3"/>
  <path class="grau" d="M104 35 L146 35"/>
  <path class="marke" d="M146 35 L140.6 37.6 L140.6 32.4 Z"/>
  <path class="grau" d="M104 35 L144 18"/>
  <path class="marke" d="M144 18 L140.0 22.5 L138.0 17.7 Z"/>
</svg>
