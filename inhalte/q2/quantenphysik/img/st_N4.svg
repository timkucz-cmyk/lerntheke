<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Strahlteiler mit zwei Detektoren und Koinzidenzzähler">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="akzent" d="M12 44 L54 44"/>
  <path class="marke" d="M54 44 L48.6 46.6 L48.6 41.4 Z"/>
  <path class="grau" d="M50 56 L72 32" stroke-width="3"/>
  <path class="akzent" d="M66 44 H104 M61 38 V22" stroke-dasharray="4 4"/>
  <rect class="fuell" x="106" y="35" width="20" height="18" rx="2"/><rect class="grau" x="106" y="35" width="20" height="18" rx="2"/>
  <rect class="fuell" x="51" y="3" width="20" height="18" rx="2"/><rect class="grau" x="51" y="3" width="20" height="18" rx="2"/>
  <text class="text" x="109" y="48">D1</text><text class="text" x="54" y="16">D2</text>
  <path class="hilfs" d="M71 12 H142 V22 M126 44 H142 V36"/>
  <circle class="grau" cx="142" cy="29" r="7"/>
  <text class="text" x="138" y="33">&amp;</text>
</svg>
