  <path class="akzent" d="M60 30 V62 H150 V30"/>
  <path class="fuell" d="M62 40 H148 V60 H62 Z"/>
  <path class="grau" d="M66 44 q8 -4 16 0 q8 4 16 0 q8 -4 16 0 q8 4 16 0 q8 -4 12 0"/>
