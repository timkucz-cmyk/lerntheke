  </style>
  <rect class="grau" x="30" y="8" width="70" height="56" rx="4"/>
  <path class="hilfs" d="M54 22 L92 22 M54 38 L92 38 M54 54 L92 54"/>
  <path class="akzent" d="M36 22 l4 4 l8 -9 M36 38 l4 4 l8 -9"/>
