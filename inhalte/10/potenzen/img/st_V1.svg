      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <rect class="grau" x="24" y="8" width="112" height="56"/>
  <path class="grau" d="M80 8 L80 64 M80 36 L136 36 M108 36 L108 64 M108 50 L136 50"/>
  <rect class="fuell" x="108" y="36" width="28" height="14"/>
  <text class="text" x="44" y="42">A1</text>
  <text class="text" x="100" y="26">A2</text>
  <text class="text" x="86" y="54">A3</text>
</svg>
