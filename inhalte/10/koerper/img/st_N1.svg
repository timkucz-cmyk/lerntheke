  </style>
  <path class="fuell" d="M40 62 h64 l22.4 -22.4 L83.2 6 Z"/>
  <path class="akzent" d="M40 62 h64 l22.4 -22.4 M40 62 L83.2 6 L104 62 M83.2 6 L126.4 39.6"/>
  <path class="hilfs" d="M40 62 l22.4 -22.4 h64 M62.4 39.6 L83.2 6"/>
