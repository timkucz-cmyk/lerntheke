  </style>
  <path class="grau" d="M8 64 L152 64"/>
  <path class="fuell" d="M20 40 L34 40 L34 64 L20 64 Z"/>
  <path class="grau" d="M20 40 L34 40 L34 64 L20 64 Z"/>
  <path class="hilfs" d="M27 44 L140 44"/>
  <path class="akzent" d="M27 44 L112 8" style="stroke-width:4"/>
