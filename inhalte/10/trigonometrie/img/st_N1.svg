<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Viertelkreis mit Radius 1, Winkel und Sinusstrecke">
  <style>
    .akzent { fill: none; stroke: #B61E33; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #B61E33; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #B61E33; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #F08A99; }
      .marke  { fill: #F08A99; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #F08A99; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="hilfs" d="M30 62 L100 62 M30 62 L30 4"/>
  <path class="grau" d="M86 62 A56 56 0 0 0 30 6"/>
  <path class="akzent" d="M30 62 L66 19"/>
  <path class="akzent" d="M66 19 L66 62" style="stroke-width:3"/>
  <path class="akzent" d="M46 62 A16 16 0 0 0 40 50"/>
  <circle class="marke" cx="66" cy="19" r="3"/>
  <text class="text" x="72" y="46">sin α</text>
  <text class="text" x="104" y="30">cos α</text>
</svg>
