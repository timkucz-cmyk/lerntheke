    }
  </style>
  <path class="akzent" d="M14 36 H48 M40 28 l8 8 l-8 8"/>
  <rect class="grau" x="70" y="12" width="8" height="38" rx="4"/>
  <circle class="marke" cx="74" cy="54" r="7"/>
  <rect class="grau" x="102" y="26" width="40" height="20"/>
  <path class="grau" d="M142 32 h4 v8 h-4"/>
  <text class="text" x="112" y="41">+ −</text>
</svg>
