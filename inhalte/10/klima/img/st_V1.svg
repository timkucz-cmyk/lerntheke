<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Sonne und drei Planeten unterschiedlicher Größe">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <circle class="akzent" cx="18" cy="36" r="7"/>
  <path class="akzent" d="M18.0 26.0 L18.0 22.0"/>
  <path class="akzent" d="M18.0 46.0 L18.0 50.0"/>
  <path class="akzent" d="M8.0 36.0 L4.0 36.0"/>
  <path class="akzent" d="M28.0 36.0 L32.0 36.0"/>
  <path class="akzent" d="M25.0 43.0 L27.8 45.8"/>
  <path class="akzent" d="M11.0 43.0 L8.2 45.8"/>
  <path class="akzent" d="M25.0 29.0 L27.8 26.2"/>
  <path class="akzent" d="M11.0 29.0 L8.2 26.2"/>
  <circle class="grau" cx="58" cy="36" r="6"/>
  <circle class="marke" cx="88" cy="36" r="11"/>
  <circle class="fuell" cx="124" cy="36" r="12"/>
</svg>
