  <rect class="grau" x="22" y="10" width="116" height="82" rx="8"/>
  <path class="hilfs" d="M40 30 H120 V72 H40 Z"/>
  <circle class="akzent" cx="80" cy="30" r="8"/>
  <path class="akzent" d="M74.3 24.3 L85.7 35.7 M74.3 35.7 L85.7 24.3"/>
  <circle class="akzent" cx="120" cy="51" r="9"/>
