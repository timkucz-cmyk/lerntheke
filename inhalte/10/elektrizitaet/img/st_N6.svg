<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 70" width="160" height="70"
     role="img" aria-label="Reihenschaltung oben, Parallelschaltung unten">
  <style>
    .akzent { fill: none; stroke: #2E75B6; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .marke  { fill: #2E75B6; }
    .grau   { fill: none; stroke: #6b7280; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .hilfs  { fill: none; stroke: #9097a0; stroke-width: 1.2; stroke-linecap: round; }
    .fuell  { fill: #2E75B6; fill-opacity: .14; }
    .text   { fill: #646a72; font: 600 11px 'Source Sans 3', system-ui, sans-serif; }
    .gross  { font-size: 20px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .akzent { stroke: #7BAEE8; }
      .marke  { fill: #7BAEE8; }
      .grau   { stroke: #9aa1a9; }
      .hilfs  { stroke: #6b7280; }
      .fuell  { fill: #7BAEE8; fill-opacity: .18; }
      .text   { fill: #9aa1a9; }
    }
  </style>
  <path class="grau" d="M12 14 H42 M64 14 H96 M118 14 H148"/>
  <rect class="akzent" x="42" y="9" width="22" height="10"/>
  <rect class="akzent" x="96" y="9" width="22" height="10"/>
  <path class="grau" d="M30 36 H130 M30 64 H130 M60 36 V41 M60 59 V64 M100 36 V41 M100 59 V64"/>
  <rect class="akzent" x="55" y="41" width="10" height="18"/>
  <rect class="akzent" x="95" y="41" width="10" height="18"/>
  <circle class="marke" cx="60" cy="36" r="2.4"/>
  <circle class="marke" cx="60" cy="64" r="2.4"/>
</svg>
